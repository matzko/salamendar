# Both hosts are replaced with PHX_HOST (see kustomization.yaml), the name
# browsers send.
# DNS reaches the node through a CNAME to the external-dns record; the
# HTTP-01 challenge follows it too.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salamendar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [set-from-phx-host]
      secretName: salamendar-tls
  rules:
    - host: set-from-phx-host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salamendar
                port: { name: http }
