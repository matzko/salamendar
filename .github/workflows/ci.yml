# Tests, lint and a Docker build on every PR and every push to main.
# Branch protection on main requires these jobs, so a merge means tested.
# A push to main then deploys (the deploy job).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR replaces its running checks. Pushes to main run in
# full, one after another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      # Matches compose.yaml and the credentials in config/test.exs.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-dev-${{ runner.os }}-
      # Building PLTs takes minutes; the core ones only change with the
      # toolchain, so a partial restore still saves most of it.
      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: plts-${{ runner.os }}-
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix dialyzer --format github

  # Checks the Kubernetes manifests against the API schemas (CRDs, like
  # cert-manager's ClusterIssuer, from the datreeio catalog).
  # traefik-values.yaml is Helm values, not a manifest.
  manifests:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM: >-
        docker run --rm -i -v ${{ github.workspace }}:/w -w /w
        ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary
        -schema-location default
        -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
      # Any valid host will do for a schema check.
      - run: cp k8s/config.env.example k8s/config.env
      - run: kubectl kustomize k8s | $KUBECONFORM -
      - run: >-
          $KUBECONFORM cluster/namespace.yaml cluster/cluster-issuer.yaml
          cluster/traefik-dns.yaml cluster/external-dns.yaml
          cluster/deployer-rbac.yaml

  # Catches a broken Dockerfile on the PR rather than at deploy time. On
  # main, also pushes the image the deploy job runs, tagged with the SHA.
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/matzko/salamendar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys main once everything above passes. Not a required check: it
  # never runs on PRs. If the rollout fails, the old pod keeps serving
  # (maxUnavailable: 0).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, manifests, docker]
    runs-on: ubuntu-24.04
    # Holds the KUBECONFIG secret, and only main may deploy to it.
    environment: production
    # Two quick merges deploy in order; neither is cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # The secret holds the kubeconfig itself; kubectl wants a path.
      - run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      # An empty host would give the Ingress no host at all.
      - run: |
          test -n "$PHX_HOST"
          echo "PHX_HOST=$PHX_HOST" > k8s/config.env
        env:
          PHX_HOST: ${{ vars.PHX_HOST }}
      - working-directory: k8s
        run: kustomize edit set image salamendar=ghcr.io/matzko/salamendar:${{ github.sha }}
      - run: kubectl apply -k k8s
      - run: kubectl -n salamendar rollout status deploy/salamendar --timeout=5m
      # The deployer Role can read pods, their logs and events for this.
      - if: failure()
        run: |
          kubectl -n salamendar get pods -o wide
          kubectl -n salamendar describe pods -l app=salamendar
          kubectl -n salamendar logs -l app=salamendar -c migrate --tail=100 || true
