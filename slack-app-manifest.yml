# Create the app at https://api.slack.com/apps → "Create New App" →
# "From a manifest", pick your workspace, and paste this file.
display_information:
  name: Salamendar
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: salamendar
    always_online: true
  slash_commands:
    - command: /salamendar
      description: Shared channel calendar
      usage_hint: "enable | disable | new | tz <zone> | week-start <day>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - users:read
      # Required by slack_elixir: Slack.ChannelServer calls
      # users.conversations for all four channel types at startup.
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      # Month canvas tab in each calendar channel.
      - canvases:write
      # conversations.join in `/salamendar enable` (public channels).
      - channels:join
      # files.info, to download and inspect existing canvases while
      # working out the month grid's layout.
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
      - app_home_opened
      - member_joined_channel
      - member_left_channel
      # Sent when the bot itself is removed; member_left_channel isn't, since
      # the bot is no longer in the channel. Slack.ChannelServer relies on
      # channel_left.
      - channel_left
      - group_left
      - channel_rename
      - channel_archive
      - channel_unarchive
      - channel_deleted
      - group_rename
      - group_archive
      - group_unarchive
      - group_deleted
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
