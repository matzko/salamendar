# Create the app at https://api.slack.com/apps → "Create New App" →
# "From a manifest", pick your workspace, and paste this file.
display_information:
  name: Salamendar
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: salamendar
    always_online: true
  slash_commands:
    - command: /salamendar
      description: Talk to Salamendar
      usage_hint: "[anything]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - users:read
      # Required by slack_elixir: Slack.ChannelServer calls
      # users.conversations for all four channel types at startup.
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
