# Helm values for the traefik/traefik chart (written against v42.1.3):
#
#   helm install traefik traefik/traefik --version 42.1.3 \
#     --namespace traefik --create-namespace -f cluster/traefik-values.yaml
#
# No LoadBalancer Service, so Linode never makes a NodeBalancer. Instead
# Traefik answers on ports 80 and 443 of each node through hostPort, and
# external-dns points DNS at the node (see traefik-dns.yaml).

deployment:
  kind: DaemonSet

# A new pod can't take the host ports until the old one lets go, so replace
# pods in place rather than surging.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  enabled: false

ports:
  web:
    port: 80
    containerPort: 80
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    containerPort: 443
    hostPort: 443

# Still non-root: inside the pod's own network namespace, binding a port
# under 1024 only needs NET_BIND_SERVICE.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
