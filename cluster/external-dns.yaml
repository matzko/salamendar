# Keeps the DNS_ZONE zone on the BIND server in step with the cluster,
# through RFC 2136 dynamic updates signed with a TSIG key. Apply through
# envsubst (see dns.env.example), after making the Secret:
#
#   kubectl create namespace external-dns
#   kubectl -n external-dns create secret generic external-dns \
#     --from-file=tsig-secret=<(awk -F'"' '/secret/ {printf "%s", $2}' externaldns.key)
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: [services, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.24.0
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef: { name: external-dns, key: tsig-secret }
          args:
            - --source=service
            - --domain-filter=${DNS_ZONE}
            # Deletes records it owns that the cluster no longer wants, so
            # a replaced node's old IP goes away.
            - --policy=sync
            # The node has a public IPv6 address, but the cluster is
            # IPv4-only, so Traefik's hostPorts don't answer on it. Without
            # this it publishes an AAAA record that IPv6 clients can't reach.
            - --exclude-target-net=::/0
            - --registry=txt
            - --txt-owner-id=salamendar-lke
            - --provider=rfc2136
            - --rfc2136-host=${DNS_SERVER}
            - --rfc2136-port=53
            - --rfc2136-zone=${DNS_ZONE}
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            # Without zone transfers it can't see existing records.
            - --rfc2136-axfr
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
