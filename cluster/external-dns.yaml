# Keeps the k8s.example.com zone on the BIND server in step with the
# cluster, through RFC 2136 dynamic updates signed with a TSIG key. Before
# applying, make the Secret:
#
#   kubectl create namespace external-dns
#   kubectl -n external-dns create secret generic external-dns \
#     --from-literal=tsig-secret=<secret from externaldns.key>
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: [services, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.24.0
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef: { name: external-dns, key: tsig-secret }
          args:
            - --source=service
            - --domain-filter=k8s.example.com
            # Deletes records it owns that the cluster no longer wants, so
            # a replaced node's old IP goes away.
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=salamendar-lke
            - --provider=rfc2136
            - --rfc2136-host=ns1.example.com
            - --rfc2136-port=53
            - --rfc2136-zone=k8s.example.com
            - --rfc2136-tsig-keyname=externaldns
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            # Without zone transfers it can't see existing records.
            - --rfc2136-axfr
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
