# What CI deploys with: enough to `kubectl apply -k k8s` and watch the
# rollout, in the salamendar namespace only. Build CI's kubeconfig from the
# token Secret below (see docs/deploy.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: salamendar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: salamendar
rules:
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch]
  # For `kubectl rollout status` and for reading a failed pod's logs.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: salamendar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: salamendar
---
# A long-lived token for the ServiceAccount. Delete and re-create the
# Secret to rotate it.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: salamendar
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
